[package]
name = "complot"
version = "0.1.0"
edition = "2024"
description = "Real-time plotting from the shell, loosely inspired by the grammar of graphics"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
eframe = "0.36"
egui_plot = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
