[package]
name = "complot"
version = "0.1.1"
edition = "2024"
description = "Real-time plotting from the shell, loosely inspired by the grammar of graphics"
license = "MIT OR Apache-2.0"
authors = ["Paolo Bosetti <paolo.bosetti@me.com>"]
repository = "https://github.com/pbosetti/complot"
homepage = "https://github.com/pbosetti/complot"
readme = "README.md"
keywords = ["plot", "plotting", "cli", "real-time", "egui"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
eframe = "0.36"
egui_plot = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# cargo-deb: run as `cargo deb --no-build --target <triple>` after a release build.
[package.metadata.deb]
maintainer = "Paolo Bosetti <paolo.bosetti@me.com>"
copyright = "2026, Paolo Bosetti"
license-file = ["LICENSE-MIT", "0"]
extended-description = """
Real-time plots driven from the shell. Each plot is its own window, and
short-lived complot calls push CSV rows or single points to it by name.
Useful for watching logs, sensor streams or simulation output live."""
section = "utils"
priority = "optional"
# The GUI loads these at runtime with dlopen, so $auto cannot detect them.
depends = "$auto, libxkbcommon0, libegl1 | libgl1"
recommends = "libvulkan1, libwayland-client0, libx11-6, libxcursor1, libxrandr2, libxi6"
# cargo-deb rewrites target/release to target/<triple>/release with --target.
assets = [
  ["target/release/complot", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/complot/README.md", "644"],
  ["LICENSE-MIT", "usr/share/doc/complot/", "644"],
  ["LICENSE-APACHE", "usr/share/doc/complot/", "644"],
]
